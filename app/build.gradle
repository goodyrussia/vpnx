plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.vpnx.dope'
    compileSdk 37

    defaultConfig {
        applicationId "com.vpnx.dope"
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName "1.0.13"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            def keystoreFile = file("vpnx-release.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("VPNX_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("VPNX_KEY_ALIAS") ?: ""
                keyPassword System.getenv("VPNX_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // AGP 9 built-in Kotlin: android.kotlinOptions is gone; use kotlin.compilerOptions
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
            freeCompilerArgs.addAll([
                "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                // Miuix 0.9.4 + kotlin-stdlib 2.4.20 were compiled with
                // Kotlin 2.4.0 metadata; AGP 9.1.1's embedded compiler is
                // 2.2.10 and refuses them. The build error itself offers
                // this flag. Revisit if a 2.4-only declaration breaks.
                "-Xskip-metadata-version-check"
            ])
        }
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties'
            ]
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // AndroidX & Lifecycle
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Compose Multiplatform / Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'

    // Miuix HyperOS UI Suite 0.9.4
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-nav:0.9.4'

    // Libsu 6.0.0 (Root Shell)
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // AndroidLibXrayLite (Xray-core with Hysteria2)
    implementation 'com.github.Asterisk4Magisk:libv2ray:v26.11.9-p1@aar'

    // SSHJ & BouncyCastle Crypto
    implementation 'com.hierynomus:sshj:0.38.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'

    // Room Database 2.7.0 (Kotlin 2.2 era; 2.6.1 predates Kotlin 2.2)
    implementation 'androidx.room:room-runtime:2.7.0'
    implementation 'androidx.room:room-ktx:2.7.0'
    ksp 'androidx.room:room-compiler:2.7.0'

    // KotlinX Serialization & Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
