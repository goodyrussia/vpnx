org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9 built-in Kotlin forbids kotlin.sourceSets, but KSP registers its
# generated sources (build/generated/ksp/...) through exactly that API.
# Google's own documented escape hatch for this (see the build error);
# without it the build fails at configuration with EvalIssueException.
android.disallowKotlinSourceSets=false
