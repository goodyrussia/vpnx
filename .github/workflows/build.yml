name: Build vpnx & Auto-Publish OTA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Bump Version (build code +1, patch +1)
        id: version_bump
        run: |
          CUR_CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle | head -n 1)
          CUR_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -n 1)
          NEW_CODE=$((CUR_CODE + 1))
          MM=${CUR_NAME%.*}
          PATCH=${CUR_NAME##*.}
          NEW_NAME="${MM}.$((PATCH + 1))"

          sed -i "s/versionCode [0-9]\+/versionCode ${NEW_CODE}/g" app/build.gradle
          sed -i "s/versionName \"[^\"]\+\"/versionName \"${NEW_NAME}\"/g" app/build.gradle
          sed -i "s/CURRENT_BUILD_CODE = [0-9]\+/CURRENT_BUILD_CODE = ${NEW_CODE}/g" app/src/main/java/com/vpnx/dope/MainActivity.kt
          sed -i "s/CURRENT_VERSION_NAME = \"[^\"]\+\"/CURRENT_VERSION_NAME = \"${NEW_NAME}\"/g" app/src/main/java/com/vpnx/dope/MainActivity.kt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/vpnx/dope/MainActivity.kt
          git commit -m "chore: bump to V${NEW_NAME} (build ${NEW_CODE}) [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || echo "bump push skipped"

          echo "build_code=${NEW_CODE}" >> $GITHUB_OUTPUT
          echo "ver_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "Bumped to V${NEW_NAME} (Build ${NEW_CODE})"

      - name: Restore signing keystore
        env:
          VPNX_KEYSTORE_BASE64: ${{ secrets.VPNX_KEYSTORE_BASE64 }}
        run: |
          echo "$VPNX_KEYSTORE_BASE64" | base64 -d > app/vpnx-release.keystore
          ls -lh app/vpnx-release.keystore

      - name: Build Signed Release APK (arm64-v8a)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8'"
          VPNX_KEYSTORE_PASSWORD: ${{ secrets.VPNX_KEYSTORE_PASSWORD }}
          VPNX_KEY_ALIAS: ${{ secrets.VPNX_KEY_ALIAS }}
          VPNX_KEY_PASSWORD: ${{ secrets.VPNX_KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK & OTA update.json
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Built: $APK_FILE"
          ls -lh "$APK_FILE"
          cp -f "$APK_FILE" ./vpnx-release.apk

          cat <<EOF > update.json
          {
            "versionCode": ${{ steps.version_bump.outputs.build_code }},
            "versionName": "${{ steps.version_bump.outputs.ver_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/vpnx-release.apk",
            "releaseNotes": "• vpnx V${{ steps.version_bump.outputs.ver_name }} (Build ${{ steps.version_bump.outputs.build_code }})\n• Fresh app: no access codes, no device locks\n• Imported configs are always open and exportable\n• Release build, arm64-v8a only"
          }
          EOF
          cat update.json

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnx-V${{ steps.version_bump.outputs.ver_name }}-Build-${{ steps.version_bump.outputs.build_code }}
          path: |
            vpnx-release.apk
            update.json

      - name: Publish OTA Release to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version_bump.outputs.ver_name }}-b${{ steps.version_bump.outputs.build_code }}
          name: "vpnx V${{ steps.version_bump.outputs.ver_name }} (Build ${{ steps.version_bump.outputs.build_code }})"
          make_latest: true
          files: |
            vpnx-release.apk
            update.json
